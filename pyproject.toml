[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hitl2"
version = "0.1.0"
description = "YubiKey 5.8-signed ghost racing with endless deterministic carrot heats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cbor2>=5.6,<6",
  "cryptography>=50.0.0",
  "fastapi>=0.116,<1",
  "fido2==2.2.1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
hitl2 = "hitl2.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/hitl2"]
